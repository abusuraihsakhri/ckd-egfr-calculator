name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile
        run: python -m compileall -q egfr_calculator.py cli.py
      - name: Test Python
        run: python -m pytest -q
      - name: CLI smoke test
        run: python cli.py batch -i sample.csv -o out_smoke.csv

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test browser calculation core
        run: node --test tests/web_calculator.test.mjs
      - name: Verify static entry point
        run: test -s index.html && test -s app.js && test -s calculator.js && test -s styles.css
